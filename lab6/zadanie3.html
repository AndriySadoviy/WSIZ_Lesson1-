<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Czas z API</title>
</head>
<body>

<h2>Aktualny czas w Polsce:</h2>
<p id="czas"></p>

<script>
async function pobierzCzas() {
  try {
    const response = await fetch("https://timeapi.io/api/Time/current/zone?timeZone=Europe/Warsaw");
    const data = await response.json();

    document.getElementById("czas").textContent =
      data.hour.toString().padStart(2, "0") + ":" +
      data.minute.toString().padStart(2, "0") + ":" +
      data.seconds.toString().padStart(2, "0");

  } catch (e) {
    document.getElementById("czas").textContent = "Błąd pobierania czasu";
  }
}

pobierzCzas();
setInterval(pobierzCzas, 1000);
</script>

</body>
</html>
