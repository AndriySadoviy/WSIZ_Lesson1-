<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 1 - Dzielenie</title>
</head>
<body>
    <h2>Kalkulator dzielenia</h2>
    <input type="text" id="liczba1" placeholder="Pierwsza liczba">
    <input type="text" id="liczba2" placeholder="Druga liczba">
    <button onclick="oblicz()">Podziel</button>
    <p id="wynik1"></p>

    <script>
        function oblicz() {
            const l1 = document.getElementById('liczba1').value;
            const l2 = document.getElementById('liczba2').value;
            const res = document.getElementById('wynik1');

            try {
                if (l1 === "" || l2 === "") throw "Pola nie mogą być puste!";
                
                let num1 = parseFloat(l1.replace(',', '.'));
                let num2 = parseFloat(l2.replace(',', '.'));

                if (isNaN(num1) || isNaN(num2)) throw "Wprowadzone dane nie są liczbami!";
                if (num2 === 0) throw "Nie można dzielić przez zero!";

                let wynik = num1 / num2;
                res.style.color = "black";
                res.innerText = "Wynik: " + wynik;
            } catch (blad) {
                res.style.color = "red";
                res.innerText = "Błąd: " + blad;
            }
        }
    </script>
</body>
</html>
