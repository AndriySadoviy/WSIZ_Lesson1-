<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 2 - Rejestracja</title>
    <style>
        .error { color: red; margin-bottom: 10px; }
        .success { color: green; font-family: monospace; white-space: pre; }
        form div { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Formularz rejestracji</h2>
    <div id="komunikaty"></div>
    
    <form id="regForm">
        <div>Nazwa użytkownika: <input type="text" id="user"></div>
        <div>Email: <input type="text" id="email"></div>
        <div>Hasło: <input type="password" id="pass1"></div>
        <div>Powtórz hasło: <input type="password" id="pass2"></div>
        <div>Data urodzenia: <input type="date" id="urodziny"></div>
        <div>Płeć: 
            <select id="plec">
                <option value="Mężczyzna">Mężczyzna</option>
                <option value="Kobieta">Kobieta</option>
                <option value="Nie chcę podawać">Nie chcę podawać</option>
            </select>
        </div>
        <div>Wersja: 
            <input type="radio" name="wersja" value="Wersja darmowa" checked> Darmowa
            <input type="radio" name="wersja" value="Wersja standardowa"> Standard
            <input type="radio" name="wersja" value="Wersja premium"> Premium
        </div>
        <div><input type="checkbox" id="regulamin"> Akceptuję regulamin</div>
        
        <button type="button" onclick="waliduj()">Zarejestruj się</button>
        <button type="reset" onclick="document.getElementById('komunikaty').innerHTML=''">Wyczyść</button>
    </form>

    <script>
        function waliduj() {
            const komunikat = document.getElementById('komunikaty');
            komunikat.innerHTML = "";
            let bledy = [];

            const user = document.getElementById('user').value;
            const email = document.getElementById('email').value;
            const p1 = document.getElementById('pass1').value;
            const p2 = document.getElementById('pass2').value;
            const dataUro = document.getElementById('urodziny').value;
            const reg = document.getElementById('regulamin').checked;
            const wersja = document.querySelector('input[name="wersja"]:checked').value;
            const plec = document.getElementById('plec').value;

  
            if(!user || !email || !p1 || !p2 || !dataUro || !reg) {
                bledy.push("Wszystkie pola (w tym regulamin) muszą być wypełnione/zaznaczone.");
            }

            if(!/^[a-zA-Z0-9]+$/.test(user)) bledy.push("Nazwa użytkownika może zawierać tylko litery i cyfry.");

         
            if(p1.length < 8 || !/\d/.test(p1)) bledy.push("Hasło musi mieć min. 8 znaków i 1 cyfrę.");
            if(p1 !== p2) bledy.push("Hasła nie są identyczne.");

            if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) bledy.push("Adres e-mail jest niepoprawny.");

            if(dataUro) {
                const dzis = new Date();
                const ur = new Date(dataUro);
                let wiek = dzis.getFullYear() - ur.getFullYear();
                if (dzis.getMonth() < ur.getMonth() || (dzis.getMonth() === ur.getMonth() && dzis.getDate() < ur.getDate())) wiek--;
                if(wiek < 18) bledy.push("Musisz być osobą pełnoletnią.");
            }

            if(bledy.length > 0) {
                komunikat.innerHTML = `<div class="error">${bledy.join('<br>')}</div>`;
            } else {
                
                const d = new Date(dataUro);
                const formatowanaData = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
                
                komunikat.innerHTML = `<div class="success">
Nazwa użytkownika: ${user}
Hasło: ${"*".repeat(p1.length)}
Adres e-mail: ${email}
Data urodzenia: ${formatowanaData}
Płeć: ${plec}
Wybrana wersja: ${wersja}</div>`;
            }
        }
    </script>
</body>
</html>
