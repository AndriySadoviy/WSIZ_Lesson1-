<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesjonalny Formularz Rejestracji</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Rejestracja</h2>
    <div id="komunikaty"></div>
    
    <form id="regForm">
        <div class="form-group">
            <label for="user">Nazwa użytkownika</label>
            <input type="text" id="user" placeholder="np. Jan123">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="email@przyklad.pl">
        </div>

        <div class="form-group">
            <label for="pass1">Hasło</label>
            <input type="password" id="pass1">
        </div>

        <div class="form-group">
            <label for="pass2">Powtórz hasło</label>
            <input type="password" id="pass2">
        </div>

        <div class="form-group">
            <label for="urodziny">Data urodzenia</label>
            <input type="date" id="urodziny">
        </div>

        <div class="form-group">
            <label for="plec">Płeć</label>
            <select id="plec">
                <option value="Mężczyzna">Mężczyzna</option>
                <option value="Kobieta">Kobieta</option>
                <option value="Inna">Inna</option>
            </select>
        </div>

        <div class="form-group">
            <label>Wybierz plan</label>
            <div class="radio-group">
                <label><input type="radio" name="wersja" value="Darmowa" checked> Darmowa</label>
                <label><input type="radio" name="wersja" value="Standard"> Standard</label>
                <label><input type="radio" name="wersja" value="Premium"> Premium</label>
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="regulamin"> 
            <label for="regulamin">Akceptuję regulamin serwisu</label>
        </div>
        
        <div class="buttons">
            <button type="button" id="btnZarejestruj">Zarejestruj</button>
            <button type="reset" id="btnWyczysc">Wyczyść</button>
        </div>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
